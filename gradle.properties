group=io.github.dsheirer
# Version of jSignalHound: the release date of the Signal Hound SDK pinned in
# native/sdk.env, as YYYY.MM.DD (signal_hound_sdk_10_05_26.zip is 2026.10.05).
# A release tag has to match it: v2026.10.05, or v2026.10.05-rc1 for a
# pre-release. Add a fourth part, such as 2026.10.05.1, to release again
# against the same SDK.
version=2026.10.05
