# Publishes the rolling "nightly" pre-release from main, tested against the
# current Signal Hound SDK, which may be newer than the one pinned in
# native/sdk.env. Runs when a pull request is merged, and on a daily schedule
# to pick up new SDK releases; the schedule skips when nothing changed.
name: Nightly

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      sdk_url: ${{ steps.decide.outputs.sdk_url }}
    steps:
      - uses: actions/checkout@v7

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source native/sdk.env
          # Signal Hound names the zip after its release date. The page may
          # link it absolutely or relative to the site.
          link="$(curl -fsSL --retry 3 "$SDK_PAGE" \
            | grep -oE "[^\"' ]*signal_hound_sdk_[0-9_]+\.zip" | head -n 1 || true)"
          case "$link" in
            '') sdk_url="$SDK_URL"
                echo "::warning::No SDK link found on $SDK_PAGE; using the pinned SDK" ;;
            /*) sdk_url="https://signalhound.com$link" ;;
            *)  sdk_url="$link" ;;
          esac
          if [ "$sdk_url" != "$SDK_URL" ]; then
            echo "::notice::Signal Hound has published $sdk_url; native/sdk.env pins $SDK_URL"
          fi
          marker="Built from ${GITHUB_SHA} and $(basename "$sdk_url")"
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] &&
             gh release view nightly --json body --jq .body 2>/dev/null | grep -qF "$marker"; then
            build=false
          fi
          version="$(sed -n 's/^version=//p' gradle.properties)"
          {
            echo "build=$build"
            echo "sdk_url=$sdk_url"
            echo "version=${version}-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      sdk_url: ${{ needs.prepare.outputs.sdk_url }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars

      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SDK_URL: ${{ needs.prepare.outputs.sdk_url }}
        run: |
          (cd jars && sha256sum *.jar > SHA256SUMS)
          gh release delete nightly --cleanup-tag --yes || true
          # Uploading separately with --clobber survives gh retrying an upload
          # that had in fact succeeded; the release is published once complete.
          gh release create nightly --draft --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --notes "Automated build of main, tested against the Signal Hound SDK $(basename "$SDK_URL"). Not for production use. The jar contains no Signal Hound libraries; install them from the SDK.

          Built from ${GITHUB_SHA} and $(basename "$SDK_URL")"
          gh release upload nightly jars/* --clobber
          gh release edit nightly --draft=false --prerelease --latest=false
